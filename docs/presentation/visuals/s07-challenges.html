<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slide 7 visual</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #f3f2ed; }
  .page { width: 1600px; height: 900px; box-sizing: border-box; padding: 40px; display: flex; }
  .panel { flex: 1; box-sizing: border-box; border: 3px solid #161616; background: #f3f2ed; }
  svg { display: block; width: 100%; height: 100%; }
  .px { font-family: "Silkscreen", monospace; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .sans { font-family: "Space Grotesk", sans-serif; }
</style>
</head>
<body>
<div class="page">

<div class="panel">
<svg viewBox="0 0 1514 814">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#161616"/></marker>
  </defs>

  <text x="36" y="58" class="px" font-size="30" fill="#161616">One mechanism for each challenge</text>
  <g class="mono" font-size="17" fill="#55544f">
    <text x="36" y="104">challenge</text>
    <text x="650" y="104">our answer</text>
  </g>

  <!-- left column: challenges -->
  <g fill="#161616">
    <rect x="36" y="122" width="520" height="80"/>
    <rect x="36" y="218" width="520" height="80"/>
    <rect x="36" y="314" width="520" height="80"/>
    <rect x="36" y="410" width="520" height="80"/>
    <rect x="36" y="506" width="520" height="80"/>
    <rect x="36" y="602" width="520" height="80"/>
    <rect x="36" y="698" width="520" height="80"/>
  </g>
  <g class="px" font-size="21" fill="#f3f2ed">
    <text x="62" y="170">Volunteers leave</text>
    <text x="62" y="266">Wrong results</text>
    <text x="62" y="362">The leader crashes</text>
    <text x="62" y="458">Split brain</text>
    <text x="62" y="554">State lost in a failover</text>
    <text x="62" y="650">Different machines</text>
    <text x="62" y="746">Untrusted volunteers</text>
  </g>

  <!-- arrows -->
  <g stroke="#161616" stroke-width="3">
    <line x1="564" y1="162" x2="640" y2="162" marker-end="url(#arrow-ink)"/>
    <line x1="564" y1="258" x2="640" y2="258" marker-end="url(#arrow-ink)"/>
    <line x1="564" y1="354" x2="640" y2="354" marker-end="url(#arrow-ink)"/>
    <line x1="564" y1="450" x2="640" y2="450" marker-end="url(#arrow-ink)"/>
    <line x1="564" y1="546" x2="640" y2="546" marker-end="url(#arrow-ink)"/>
    <line x1="564" y1="642" x2="640" y2="642" marker-end="url(#arrow-ink)"/>
    <line x1="564" y1="738" x2="640" y2="738" marker-end="url(#arrow-ink)"/>
  </g>

  <!-- right column: answers -->
  <g fill="#f3f2ed" stroke="#161616" stroke-width="3">
    <rect x="650" y="122" width="828" height="80"/>
    <rect x="650" y="218" width="828" height="80"/>
    <rect x="650" y="314" width="828" height="80"/>
    <rect x="650" y="410" width="828" height="80"/>
    <rect x="650" y="506" width="828" height="80"/>
    <rect x="650" y="602" width="828" height="80"/>
    <rect x="650" y="698" width="828" height="80"/>
  </g>
  <g fill="#2f5bff">
    <rect x="650" y="122" width="12" height="80"/>
    <rect x="650" y="218" width="12" height="80"/>
    <rect x="650" y="314" width="12" height="80"/>
    <rect x="650" y="410" width="12" height="80"/>
    <rect x="650" y="506" width="12" height="80"/>
    <rect x="650" y="602" width="12" height="80"/>
    <rect x="650" y="698" width="12" height="80"/>
  </g>
  <g class="sans" font-size="24" fill="#161616">
    <text x="688" y="171">Leases + SWIM gossip</text>
    <text x="688" y="267">3 copies, 2 must agree; trust scores</text>
    <text x="688" y="363">Bully election with terms</text>
    <text x="688" y="459">A leader acts only while 2 of 3 coordinators confirm it</text>
    <text x="688" y="555">Every change on 2 of 3 coordinators; catch-up before acting</text>
    <text x="688" y="651">Resource discovery: memory, speed, trust</text>
    <text x="688" y="747">Tokens, session secrets, signed tasks</text>
  </g>
</svg>
</div>

</div>
</body>
</html>
