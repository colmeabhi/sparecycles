<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slide 8 visual</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #f3f2ed; }
  .page { width: 1600px; height: 900px; box-sizing: border-box; padding: 40px; display: flex; gap: 31px; }
  .panel { width: 486px; box-sizing: border-box; border: 3px solid #161616; background: #f3f2ed; }
  svg { display: block; width: 100%; height: 100%; }
  .px { font-family: "Silkscreen", monospace; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .sans { font-family: "Space Grotesk", sans-serif; }
</style>
</head>
<body>
<div class="page">

<!-- lease -->
<div class="panel">
<svg viewBox="0 0 480 814">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#161616"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bff"/></marker>
  </defs>
  <text x="36" y="58" class="px" font-size="30" fill="#161616">Lease</text>
  <text x="36" y="92" class="mono" font-size="17" fill="#55544f">a deadline for each copy</text>

  <text x="36" y="160" class="mono" font-size="18" fill="#161616">3 min by default</text>
  <rect x="36" y="180" width="408" height="36" fill="#dcdad2" stroke="#161616" stroke-width="2"/>
  <rect x="36" y="180" width="300" height="36" fill="#161616"/>
  <line x1="444" y1="166" x2="444" y2="230" stroke="#ff5a1f" stroke-width="5"/>
  <text x="36" y="254" class="mono" font-size="15" fill="#55544f">copy given out</text>
  <text x="444" y="254" class="mono" font-size="15" fill="#ff5a1f" text-anchor="end">deadline</text>

  <rect x="36" y="300" width="408" height="64" fill="#ff5a1f"/>
  <text x="240" y="341" class="px" font-size="22" fill="#161616" text-anchor="middle">lease expired</text>
  <text x="240" y="398" class="mono" font-size="17" fill="#55544f" text-anchor="middle">or</text>
  <rect x="36" y="420" width="408" height="64" fill="#ff5a1f"/>
  <text x="240" y="461" class="px" font-size="22" fill="#161616" text-anchor="middle">volunteer is dead</text>

  <line x1="240" y1="490" x2="240" y2="540" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink)"/>

  <rect x="36" y="548" width="408" height="100" fill="#161616"/>
  <text x="240" y="590" class="px" font-size="22" fill="#f3f2ed" text-anchor="middle">the copy goes to</text>
  <text x="240" y="624" class="px" font-size="22" fill="#f3f2ed" text-anchor="middle">another volunteer</text>

  <!-- old and new volunteer -->
  <rect x="110" y="690" width="64" height="64" fill="#dcdad2" stroke="#161616" stroke-width="2"/>
  <g stroke="#ff5a1f" stroke-width="5">
    <line x1="122" y1="702" x2="162" y2="742"/>
    <line x1="162" y1="702" x2="122" y2="742"/>
  </g>
  <line x1="184" y1="722" x2="294" y2="722" stroke="#2f5bff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="306" y="690" width="64" height="64" fill="#161616"/>
  <text x="142" y="784" class="mono" font-size="15" fill="#55544f" text-anchor="middle">old</text>
  <text x="338" y="784" class="mono" font-size="15" fill="#55544f" text-anchor="middle">new</text>
</svg>
</div>

<!-- vote -->
<div class="panel">
<svg viewBox="0 0 480 814">
  <defs>
    <marker id="arrow-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#161616"/></marker>
  </defs>
  <text x="36" y="58" class="px" font-size="30" fill="#161616">Vote</text>
  <text x="36" y="92" class="mono" font-size="17" fill="#55544f">compare SHA-256 hashes</text>

  <text x="36" y="160" class="mono" font-size="18" fill="#161616">3 results</text>
  <rect x="36" y="178" width="120" height="80" fill="#2f5bff"/>
  <rect x="180" y="178" width="120" height="80" fill="#2f5bff"/>
  <rect x="324" y="178" width="120" height="80" fill="#ff5a1f"/>
  <g class="px" font-size="30" text-anchor="middle">
    <text x="96" y="230" fill="#f3f2ed">A</text>
    <text x="240" y="230" fill="#f3f2ed">A</text>
    <text x="384" y="230" fill="#161616">B</text>
  </g>
  <line x1="240" y1="264" x2="240" y2="304" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink2)"/>
  <rect x="36" y="312" width="408" height="90" fill="#161616"/>
  <text x="240" y="352" class="px" font-size="24" fill="#f3f2ed" text-anchor="middle">accepted</text>
  <text x="240" y="382" class="mono" font-size="16" fill="#dcdad2" text-anchor="middle">2 of 3 hashes are equal</text>

  <text x="36" y="490" class="mono" font-size="18" fill="#161616">no majority</text>
  <g fill="#dcdad2" stroke="#161616" stroke-width="2">
    <rect x="36" y="508" width="56" height="60"/>
    <rect x="100" y="508" width="56" height="60"/>
    <rect x="164" y="508" width="56" height="60"/>
  </g>
  <g class="px" font-size="22" fill="#161616" text-anchor="middle">
    <text x="64" y="546">A</text>
    <text x="128" y="546">B</text>
    <text x="192" y="546">C</text>
  </g>
  <line x1="228" y1="538" x2="276" y2="538" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink2)"/>
  <rect x="284" y="508" width="160" height="60" fill="#ff5a1f"/>
  <text x="364" y="546" class="px" font-size="22" fill="#161616" text-anchor="middle">+2 copies</text>

  <text x="36" y="664" class="mono" font-size="18" fill="#161616">a late copy</text>
  <rect x="36" y="682" width="60" height="60" fill="none" stroke="#161616" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="66" y="720" class="px" font-size="22" fill="#161616" text-anchor="middle">A</text>
  <line x1="104" y1="712" x2="170" y2="712" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink2)"/>
  <rect x="178" y="682" width="266" height="60" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
  <text x="311" y="720" class="px" font-size="22" fill="#161616" text-anchor="middle">still checked</text>
</svg>
</div>

<!-- resource discovery -->
<div class="panel">
<svg viewBox="0 0 480 814">
  <defs>
    <marker id="arrow-blue3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bff"/></marker>
    <marker id="arrow-ink3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#161616"/></marker>
  </defs>
  <text x="36" y="58" class="px" font-size="28" fill="#161616">Resource discovery</text>
  <text x="36" y="92" class="mono" font-size="17" fill="#55544f">trust from votes</text>

  <!-- formula -->
  <rect x="36" y="130" width="408" height="100" fill="#161616"/>
  <g class="mono" font-size="20" fill="#f3f2ed">
    <text x="56" y="188">trust =</text>
    <text x="320" y="168" text-anchor="middle">correct + 1</text>
    <text x="320" y="214" text-anchor="middle">correct + wrong + 2</text>
  </g>
  <line x1="200" y1="181" x2="436" y2="181" stroke="#f3f2ed" stroke-width="2"/>

  <!-- trust bar -->
  <g class="mono" font-size="16" fill="#161616" text-anchor="middle">
    <text x="56" y="298">0</text>
    <text x="166" y="298">0.3</text>
    <text x="277" y="298">0.6</text>
    <text x="424" y="298">1</text>
  </g>
  <rect x="56" y="312" width="110" height="44" fill="#ff5a1f"/>
  <rect x="166" y="312" width="111" height="44" fill="#dcdad2"/>
  <rect x="277" y="312" width="147" height="44" fill="#2f5bff"/>
  <rect x="56" y="312" width="368" height="44" fill="none" stroke="#161616" stroke-width="3"/>
  <g stroke="#161616" stroke-width="3">
    <line x1="166" y1="304" x2="166" y2="364"/>
    <line x1="277" y1="304" x2="277" y2="364"/>
  </g>
  <g class="mono" font-size="15" fill="#161616" text-anchor="middle">
    <text x="111" y="386">blocked</text>
    <text x="221" y="386">no last</text>
    <text x="221" y="406">copy</text>
  </g>

  <text x="36" y="460" class="sans" font-size="19" fill="#161616">A faulty volunteer is blocked</text>
  <text x="36" y="486" class="sans" font-size="19" fill="#161616">after its 2nd wrong result.</text>

  <!-- slow volunteers take the newest units -->
  <text x="83" y="560" class="mono" font-size="15" fill="#55544f">oldest</text>
  <text x="397" y="560" class="mono" font-size="15" fill="#55544f" text-anchor="end">newest</text>
  <g fill="#dcdad2" stroke="#161616" stroke-width="2">
    <rect x="83" y="572" width="44" height="44"/>
    <rect x="137" y="572" width="44" height="44"/>
    <rect x="191" y="572" width="44" height="44"/>
    <rect x="245" y="572" width="44" height="44"/>
    <rect x="299" y="572" width="44" height="44"/>
    <rect x="353" y="572" width="44" height="44"/>
  </g>
  <rect x="36" y="672" width="160" height="50" fill="#2f5bff"/>
  <text x="116" y="704" class="px" font-size="20" fill="#f3f2ed" text-anchor="middle">fast</text>
  <rect x="284" y="672" width="160" height="50" fill="#dcdad2" stroke="#161616" stroke-width="2"/>
  <text x="364" y="704" class="px" font-size="20" fill="#161616" text-anchor="middle">slow</text>
  <line x1="116" y1="668" x2="106" y2="624" stroke="#2f5bff" stroke-width="3" marker-end="url(#arrow-blue3)"/>
  <line x1="364" y1="668" x2="374" y2="624" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink3)"/>

  <text x="36" y="764" class="sans" font-size="19" fill="#161616">While fast ones are active, slow ones</text>
  <text x="36" y="790" class="sans" font-size="19" fill="#161616">take the newest units.</text>
</svg>
</div>

</div>
</body>
</html>
