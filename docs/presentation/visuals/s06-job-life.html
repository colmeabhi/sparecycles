<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slide 6 visual</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #f3f2ed; }
  .page { width: 1600px; height: 900px; box-sizing: border-box; padding: 40px; display: flex; }
  .panel { flex: 1; box-sizing: border-box; border: 3px solid #161616; background: #f3f2ed; }
  svg { display: block; width: 100%; height: 100%; }
  .px { font-family: "Silkscreen", monospace; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .sans { font-family: "Space Grotesk", sans-serif; }
</style>
</head>
<body>
<div class="page">

<div class="panel">
<svg viewBox="0 0 1514 814">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bff"/></marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#161616"/></marker>
    <g id="grid">
      <rect x="0" y="0" width="20" height="20"/><rect x="25" y="0" width="20" height="20"/><rect x="50" y="0" width="20" height="20"/>
      <rect x="0" y="25" width="20" height="20"/><rect x="25" y="25" width="20" height="20"/><rect x="50" y="25" width="20" height="20"/>
      <rect x="0" y="50" width="20" height="20"/><rect x="25" y="50" width="20" height="20"/><rect x="50" y="50" width="20" height="20"/>
    </g>
  </defs>

  <text x="36" y="58" class="px" font-size="30" fill="#161616">Split, pull, run, vote, merge</text>
  <text x="36" y="92" class="mono" font-size="17" fill="#55544f">the life of one job</text>

  <!-- tiles -->
  <g fill="#f3f2ed" stroke="#161616" stroke-width="3">
    <rect x="40" y="140" width="250" height="450"/>
    <rect x="336" y="140" width="250" height="450"/>
    <rect x="632" y="140" width="250" height="450"/>
    <rect x="928" y="140" width="250" height="450"/>
    <rect x="1224" y="140" width="250" height="450"/>
  </g>

  <!-- arrows between tiles -->
  <g stroke="#161616" stroke-width="3">
    <line x1="294" y1="330" x2="332" y2="330" marker-end="url(#arrow-ink)"/>
    <line x1="590" y1="330" x2="628" y2="330" marker-end="url(#arrow-ink)"/>
    <line x1="886" y1="330" x2="924" y2="330" marker-end="url(#arrow-ink)"/>
    <line x1="1182" y1="330" x2="1220" y2="330" marker-end="url(#arrow-ink)"/>
  </g>

  <!-- numbers and names -->
  <g class="px" font-size="40" fill="#2f5bff">
    <text x="62" y="196">1</text>
    <text x="358" y="196">2</text>
    <text x="654" y="196">3</text>
    <text x="950" y="196">4</text>
    <text x="1246" y="196">5</text>
  </g>
  <g class="px" font-size="26" fill="#161616">
    <text x="62" y="240">split</text>
    <text x="358" y="240">pull x3</text>
    <text x="654" y="240">run</text>
    <text x="950" y="240">vote</text>
    <text x="1246" y="240">merge</text>
  </g>

  <!-- 1 split -->
  <rect x="68" y="295" width="70" height="70" fill="#161616"/>
  <line x1="144" y1="330" x2="180" y2="330" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <use href="#grid" x="190" y="295" fill="#dcdad2" stroke="#161616" stroke-width="2"/>

  <!-- 2 pull x3 -->
  <rect x="366" y="308" width="44" height="44" fill="#161616"/>
  <g stroke="#2f5bff" stroke-width="3">
    <line x1="414" y1="324" x2="490" y2="292" marker-end="url(#arrow-blue)"/>
    <line x1="414" y1="330" x2="490" y2="330" marker-end="url(#arrow-blue)"/>
    <line x1="414" y1="336" x2="490" y2="368" marker-end="url(#arrow-blue)"/>
  </g>
  <g fill="#f3f2ed" stroke="#161616" stroke-width="3">
    <rect x="498" y="273" width="40" height="34"/>
    <rect x="498" y="313" width="40" height="34"/>
    <rect x="498" y="353" width="40" height="34"/>
  </g>
  <text x="461" y="410" class="mono" font-size="15" fill="#55544f" text-anchor="middle">3 volunteers</text>

  <!-- 3 run -->
  <rect x="656" y="290" width="96" height="80" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
  <polyline points="680,330 696,348 728,308" fill="none" stroke="#2f5bff" stroke-width="6"/>
  <line x1="756" y1="330" x2="796" y2="330" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <rect x="804" y="305" width="50" height="50" fill="#161616"/>
  <text x="704" y="398" class="mono" font-size="15" fill="#55544f" text-anchor="middle">signature</text>
  <text x="829" y="398" class="mono" font-size="15" fill="#55544f" text-anchor="middle">result</text>

  <!-- 4 vote -->
  <rect x="952" y="280" width="56" height="56" fill="#2f5bff"/>
  <rect x="1025" y="280" width="56" height="56" fill="#2f5bff"/>
  <rect x="1098" y="280" width="56" height="56" fill="#ff5a1f"/>
  <g class="px" font-size="24" text-anchor="middle">
    <text x="980" y="317" fill="#f3f2ed">A</text>
    <text x="1053" y="317" fill="#f3f2ed">A</text>
    <text x="1126" y="317" fill="#161616">B</text>
  </g>
  <text x="1053" y="384" class="px" font-size="24" fill="#161616" text-anchor="middle">2 of 3</text>

  <!-- 5 merge -->
  <use href="#grid" x="1252" y="295" fill="#2f5bff" stroke="#161616" stroke-width="2"/>
  <line x1="1328" y1="330" x2="1364" y2="330" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <rect x="1374" y="295" width="70" height="70" fill="#161616"/>

  <!-- step text -->
  <g class="sans" font-size="20" fill="#161616">
    <text x="62" y="466">The leader splits</text>
    <text x="62" y="494">the job into units.</text>

    <text x="358" y="466">Each unit goes to 3</text>
    <text x="358" y="494">different volunteers,</text>
    <text x="358" y="522">with a lease and</text>
    <text x="358" y="550">a signature.</text>

    <text x="654" y="466">Each volunteer</text>
    <text x="654" y="494">checks the signature,</text>
    <text x="654" y="522">runs the unit and</text>
    <text x="654" y="550">sends the result.</text>

    <text x="950" y="466">When 2 results agree,</text>
    <text x="950" y="494">the leader accepts</text>
    <text x="950" y="522">the unit.</text>

    <text x="1246" y="466">When all units are</text>
    <text x="1246" y="494">accepted, the leader</text>
    <text x="1246" y="522">merges the outputs.</text>
  </g>

  <!-- backup-first strip -->
  <rect x="40" y="636" width="1434" height="136" fill="#161616"/>
  <text x="72" y="692" class="px" font-size="24" fill="#f3f2ed">Every table change</text>
  <text x="72" y="728" class="px" font-size="24" fill="#f3f2ed">reaches a backup first</text>

  <g class="mono" font-size="17" text-anchor="middle">
    <rect x="770" y="674" width="190" height="60" fill="#f3f2ed"/>
    <text x="865" y="710" fill="#161616">1  change</text>
    <rect x="1010" y="674" width="200" height="60" fill="#2f5bff"/>
    <text x="1110" y="710" fill="#f3f2ed">2  backup has it</text>
    <rect x="1260" y="674" width="190" height="60" fill="#f3f2ed"/>
    <text x="1355" y="710" fill="#161616">3  leader applies</text>
  </g>
  <g stroke="#f3f2ed" stroke-width="3">
    <line x1="964" y1="704" x2="1004" y2="704"/>
    <line x1="1214" y1="704" x2="1254" y2="704"/>
  </g>
  <path d="M996,697 L1006,704 L996,711 z" fill="#f3f2ed"/>
  <path d="M1246,697 L1256,704 L1246,711 z" fill="#f3f2ed"/>
</svg>
</div>

</div>
</body>
</html>
