<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slide 5 visual</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #f3f2ed; }
  .page { width: 1600px; height: 900px; box-sizing: border-box; padding: 40px; display: flex; }
  .panel { flex: 1; box-sizing: border-box; border: 3px solid #161616; background: #f3f2ed; }
  svg { display: block; width: 100%; height: 100%; }
  .px { font-family: "Silkscreen", monospace; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .sans { font-family: "Space Grotesk", sans-serif; }
</style>
</head>
<body>
<div class="page">

<div class="panel">
<svg viewBox="0 0 1514 814">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bff"/></marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#161616"/></marker>
    <g id="table-dark">
      <rect x="0" y="0" width="22" height="12" fill="#55544f"/><rect x="26" y="0" width="22" height="12" fill="#55544f"/><rect x="52" y="0" width="22" height="12" fill="#55544f"/>
      <rect x="0" y="16" width="22" height="12" fill="#dcdad2"/><rect x="26" y="16" width="22" height="12" fill="#dcdad2"/><rect x="52" y="16" width="22" height="12" fill="#dcdad2"/>
      <rect x="0" y="32" width="22" height="12" fill="#dcdad2"/><rect x="26" y="32" width="22" height="12" fill="#dcdad2"/><rect x="52" y="32" width="22" height="12" fill="#dcdad2"/>
    </g>
    <g id="table-light">
      <rect x="0" y="0" width="22" height="12" fill="#161616"/><rect x="26" y="0" width="22" height="12" fill="#161616"/><rect x="52" y="0" width="22" height="12" fill="#161616"/>
      <rect x="0" y="16" width="22" height="12" fill="#dcdad2"/><rect x="26" y="16" width="22" height="12" fill="#dcdad2"/><rect x="52" y="16" width="22" height="12" fill="#dcdad2"/>
      <rect x="0" y="32" width="22" height="12" fill="#dcdad2"/><rect x="26" y="32" width="22" height="12" fill="#dcdad2"/><rect x="52" y="32" width="22" height="12" fill="#dcdad2"/>
    </g>
  </defs>

  <text x="36" y="58" class="px" font-size="30" fill="#161616">Three roles, one leader</text>
  <text x="36" y="92" class="mono" font-size="17" fill="#55544f">client · 3 coordinators · volunteers</text>

  <!-- gossip band around coordinators and volunteers -->
  <rect x="270" y="205" width="970" height="490" rx="28" fill="none" stroke="#2f5bff" stroke-width="3" stroke-dasharray="12 9"/>
  <text x="1222" y="680" class="mono" font-size="17" fill="#2f5bff" text-anchor="end">everyone gossips (SWIM)</text>

  <!-- coordinator group -->
  <rect x="290" y="220" width="930" height="190" fill="#dcdad2"/>
  <text x="306" y="246" class="mono" font-size="16" fill="#161616">3 coordinators</text>

  <!-- client -->
  <rect x="655" y="112" width="200" height="70" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
  <text x="755" y="156" class="px" font-size="22" fill="#161616" text-anchor="middle">client</text>
  <text x="876" y="142" class="mono" font-size="16" fill="#55544f">submits a job</text>
  <text x="876" y="166" class="mono" font-size="16" fill="#55544f">reads the result</text>
  <line x1="755" y1="186" x2="755" y2="256" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink)"/>

  <!-- backups and leader -->
  <rect x="320" y="262" width="210" height="130" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
  <text x="425" y="298" class="px" font-size="22" fill="#161616" text-anchor="middle">backup</text>
  <use href="#table-light" x="388" y="312"/>
  <text x="425" y="378" class="mono" font-size="15" fill="#55544f" text-anchor="middle">table copy</text>

  <rect x="640" y="262" width="230" height="130" fill="#161616"/>
  <text x="755" y="298" class="px" font-size="24" fill="#f3f2ed" text-anchor="middle">leader</text>
  <use href="#table-dark" x="718" y="312"/>
  <text x="755" y="378" class="mono" font-size="15" fill="#dcdad2" text-anchor="middle">task table</text>

  <rect x="980" y="262" width="210" height="130" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
  <text x="1085" y="298" class="px" font-size="22" fill="#161616" text-anchor="middle">backup</text>
  <use href="#table-light" x="1048" y="312"/>
  <text x="1085" y="378" class="mono" font-size="15" fill="#55544f" text-anchor="middle">table copy</text>

  <!-- replication -->
  <line x1="636" y1="345" x2="536" y2="345" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <line x1="874" y1="345" x2="974" y2="345" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <text x="585" y="328" class="mono" font-size="15" fill="#161616" text-anchor="middle">replicate</text>
  <text x="925" y="328" class="mono" font-size="15" fill="#161616" text-anchor="middle">replicate</text>

  <!-- follower note -->
  <line x1="1194" y1="327" x2="1258" y2="327" stroke="#161616" stroke-width="3"/>
  <rect x="1258" y="262" width="226" height="130" fill="#ff5a1f"/>
  <text x="1371" y="296" class="mono" font-size="15" fill="#161616" text-anchor="middle">a follower answers</text>
  <text x="1371" y="330" class="px" font-size="18" fill="#161616" text-anchor="middle">not the leader</text>
  <text x="1371" y="370" class="mono" font-size="15" fill="#161616" text-anchor="middle">caller tries the next</text>

  <!-- prometheus -->
  <rect x="36" y="270" width="190" height="90" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
  <text x="131" y="310" class="px" font-size="19" fill="#161616" text-anchor="middle">prometheus</text>
  <text x="131" y="338" class="mono" font-size="15" fill="#55544f" text-anchor="middle">metrics</text>
  <line x1="230" y1="315" x2="284" y2="315" stroke="#161616" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-ink)"/>
  <text x="131" y="390" class="mono" font-size="15" fill="#55544f" text-anchor="middle">scrapes all 3</text>

  <!-- volunteers pull from the leader -->
  <g stroke="#2f5bff" stroke-width="3" fill="none">
    <line x1="379" y1="536" x2="695" y2="398" marker-end="url(#arrow-blue)"/>
    <line x1="567" y1="536" x2="725" y2="398" marker-end="url(#arrow-blue)"/>
    <line x1="755" y1="536" x2="755" y2="398" marker-end="url(#arrow-blue)"/>
    <line x1="943" y1="536" x2="785" y2="398" marker-end="url(#arrow-blue)"/>
    <line x1="1131" y1="536" x2="815" y2="398" marker-end="url(#arrow-blue)"/>
  </g>
  <text x="700" y="478" class="px" font-size="20" fill="#2f5bff" text-anchor="middle">pull</text>

  <g class="px" font-size="17" fill="#161616" text-anchor="middle">
    <rect x="299" y="540" width="160" height="90" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
    <text x="379" y="592">volunteer</text>
    <rect x="487" y="540" width="160" height="90" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
    <text x="567" y="592">volunteer</text>
    <rect x="675" y="540" width="160" height="90" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
    <text x="755" y="592">volunteer</text>
    <rect x="863" y="540" width="160" height="90" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
    <text x="943" y="592">volunteer</text>
    <rect x="1051" y="540" width="160" height="90" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
    <text x="1131" y="592">volunteer</text>
  </g>

  <text x="36" y="752" class="sans" font-size="21" fill="#161616">Volunteers pull units from the leader, run them and send the results.</text>
  <text x="36" y="784" class="sans" font-size="21" fill="#161616">All traffic is gRPC.</text>
</svg>
</div>

</div>
</body>
</html>
