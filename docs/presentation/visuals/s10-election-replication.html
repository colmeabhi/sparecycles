<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slide 10 visual</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #f3f2ed; }
  .page { width: 1600px; height: 900px; box-sizing: border-box; padding: 40px; display: flex; gap: 30px; }
  .panel { box-sizing: border-box; border: 3px solid #161616; background: #f3f2ed; }
  .election { width: 900px; }
  .replication { width: 590px; }
  svg { display: block; width: 100%; height: 100%; }
  .px { font-family: "Silkscreen", monospace; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .sans { font-family: "Space Grotesk", sans-serif; }
</style>
</head>
<body>
<div class="page">

<div class="panel election">
<svg viewBox="0 0 894 814">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#161616"/></marker>
  </defs>
  <text x="36" y="58" class="px" font-size="30" fill="#161616">Election</text>
  <text x="36" y="92" class="mono" font-size="17" fill="#55544f">a backup takes over in a higher term</text>

  <!-- time axis -->
  <line x1="40" y1="250" x2="852" y2="250" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <text x="852" y="284" class="mono" font-size="15" fill="#55544f" text-anchor="end">time</text>

  <!-- heartbeats -->
  <g fill="#2f5bff">
    <rect x="53" y="243" width="14" height="14"/>
    <rect x="123" y="243" width="14" height="14"/>
    <rect x="193" y="243" width="14" height="14"/>
    <rect x="263" y="243" width="14" height="14"/>
  </g>
  <text x="40" y="205" class="mono" font-size="17" fill="#2f5bff">heartbeat every 500 ms</text>

  <!-- crash -->
  <rect x="325" y="235" width="30" height="30" fill="#ff5a1f"/>
  <text x="340" y="306" class="mono" font-size="17" fill="#ff5a1f" text-anchor="middle">leader crash</text>

  <!-- silence -->
  <g stroke="#55544f" stroke-width="2">
    <line x1="358" y1="226" x2="618" y2="226" stroke-dasharray="7 5"/>
    <line x1="358" y1="218" x2="358" y2="234"/>
    <line x1="618" y1="218" x2="618" y2="234"/>
  </g>
  <text x="488" y="205" class="mono" font-size="17" fill="#55544f" text-anchor="middle">2 s, no heartbeat</text>

  <!-- election -->
  <rect x="607" y="237" width="26" height="26" fill="#2f5bff"/>
  <text x="620" y="306" class="mono" font-size="17" fill="#2f5bff" text-anchor="middle">election, higher term</text>

  <!-- new leader -->
  <rect x="675" y="235" width="30" height="30" fill="#161616"/>
  <text x="712" y="205" class="px" font-size="18" fill="#161616" text-anchor="middle">new leader</text>

  <!-- measured gap -->
  <g stroke="#161616" stroke-width="3">
    <line x1="340" y1="340" x2="690" y2="340"/>
    <line x1="340" y1="330" x2="340" y2="350"/>
    <line x1="690" y1="330" x2="690" y2="350"/>
  </g>
  <text x="515" y="380" class="px" font-size="22" fill="#161616" text-anchor="middle">2.5 s</text>

  <!-- steps of the winner -->
  <text x="36" y="438" class="mono" font-size="17" fill="#161616">the backup that starts the election:</text>
  <g fill="#f3f2ed" stroke="#161616" stroke-width="3">
    <rect x="36" y="456" width="190" height="140"/>
    <rect x="244" y="456" width="190" height="140"/>
    <rect x="452" y="456" width="190" height="140"/>
  </g>
  <rect x="660" y="456" width="190" height="140" fill="#161616"/>
  <g stroke="#161616" stroke-width="3">
    <line x1="228" y1="526" x2="241" y2="526"/>
    <line x1="436" y1="526" x2="449" y2="526"/>
    <line x1="644" y1="526" x2="657" y2="526"/>
  </g>
  <g class="px" font-size="26" fill="#2f5bff">
    <text x="56" y="496">1</text>
    <text x="264" y="496">2</text>
    <text x="472" y="496">3</text>
    <text x="680" y="496">4</text>
  </g>
  <g class="sans" font-size="20" fill="#161616">
    <text x="56" y="534">wins with</text>
    <text x="56" y="560">2 of 3 votes</text>
    <text x="264" y="534">loads the</text>
    <text x="264" y="560">newest table</text>
    <text x="472" y="534">waits out the</text>
    <text x="472" y="560">old leader's</text>
    <text x="472" y="586">lease</text>
  </g>
  <g class="sans" font-size="20" fill="#f3f2ed">
    <text x="680" y="534">acts as the</text>
    <text x="680" y="560">new leader</text>
  </g>

  <!-- measurement -->
  <rect x="36" y="636" width="814" height="140" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
  <text x="62" y="730" class="px" font-size="54" fill="#161616">2.5 s</text>
  <g class="sans" font-size="20" fill="#161616">
    <text x="300" y="684">Measured: the leader was killed during</text>
    <text x="300" y="712">a 256-unit job. A new leader took over</text>
    <text x="300" y="740">2.5 s later, and the job finished.</text>
  </g>
</svg>
</div>

<div class="panel replication">
<svg viewBox="0 0 584 814">
  <defs>
    <marker id="arrow-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#161616"/></marker>
    <marker id="arrow-blue2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bff"/></marker>
  </defs>
  <text x="36" y="58" class="px" font-size="30" fill="#161616">Replication</text>
  <text x="36" y="92" class="mono" font-size="17" fill="#55544f">no confirmed change is lost</text>

  <rect x="182" y="140" width="220" height="100" fill="#161616"/>
  <text x="292" y="182" class="px" font-size="24" fill="#f3f2ed" text-anchor="middle">leader</text>
  <text x="292" y="214" class="mono" font-size="15" fill="#dcdad2" text-anchor="middle">task table</text>

  <rect x="36" y="410" width="200" height="100" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
  <text x="136" y="452" class="px" font-size="22" fill="#161616" text-anchor="middle">backup</text>
  <text x="136" y="484" class="mono" font-size="15" fill="#55544f" text-anchor="middle">task table</text>
  <rect x="348" y="410" width="200" height="100" fill="#f3f2ed" stroke="#161616" stroke-width="3"/>
  <text x="448" y="452" class="px" font-size="22" fill="#161616" text-anchor="middle">backup</text>
  <text x="448" y="484" class="mono" font-size="15" fill="#55544f" text-anchor="middle">task table</text>

  <!-- change to both backups -->
  <line x1="225" y1="244" x2="127" y2="404" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink2)"/>
  <line x1="359" y1="244" x2="457" y2="404" stroke="#161616" stroke-width="3" marker-end="url(#arrow-ink2)"/>
  <text x="150" y="320" class="mono" font-size="17" fill="#161616" text-anchor="end">1 change</text>
  <text x="434" y="320" class="mono" font-size="17" fill="#161616">1 change</text>

  <!-- one backup confirms -->
  <line x1="180" y1="406" x2="278" y2="246" stroke="#2f5bff" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow-blue2)"/>
  <text x="246" y="350" class="mono" font-size="17" fill="#2f5bff">2 has it</text>

  <rect x="36" y="556" width="512" height="70" fill="#dcdad2"/>
  <text x="292" y="598" class="mono" font-size="18" fill="#161616" text-anchor="middle">3  the leader applies the change</text>

  <!-- copies -->
  <rect x="36" y="680" width="54" height="54" fill="#2f5bff"/>
  <rect x="100" y="680" width="54" height="54" fill="#2f5bff"/>
  <rect x="164" y="680" width="54" height="54" fill="#dcdad2" stroke="#161616" stroke-width="2"/>
  <text x="246" y="720" class="px" font-size="28" fill="#161616">2 of 3 copies</text>
  <text x="36" y="776" class="sans" font-size="20" fill="#161616">applied only after 1 backup has it</text>
</svg>
</div>

</div>
</body>
</html>
