# Deploys site/ to GitHub Pages on each push to main that changes it.
#
# One-time setup by the repo owner: Settings → Pages → Source: "GitHub Actions".
# Until then, this job fails at the configure step.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as in GitHub's Pages starter workflow. With upload and deploy in one
# job, deploy-pages sometimes asked for the artifact before GitHub listed it
# ("No artifacts named github-pages were found"). The job boundary gives the
# artifact time to appear.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
